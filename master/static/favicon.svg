<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Favicon: accent-colored badge, white V, visible on all tabs -->
  <rect x="0" y="0" width="200" height="200" rx="36" ry="36" fill="#E8650A" />
  <!-- Rounded square frame — white -->
  <rect
    x="28" y="28" width="144" height="144" rx="28" ry="28"
    stroke="#FFFFFF" stroke-width="10" fill="none"
  />
  <!-- Letter V — bold geometric -->
  <path
    d="M 56,52 L 100,158 L 144,52"
    stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />
</svg>
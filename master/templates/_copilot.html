<aside class="copilot" id="copilot">
  <div class="copilot__glow"></div>

  {# Header #}
  <div class="copilot__header">
    <div class="copilot__header-left">
      <div class="copilot__avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <div>
        <div class="copilot__header-title">Copilot</div>
        <div class="copilot__header-status">
          <span class="copilot__header-status-dot"></span>
          <span class="copilot__header-status-text">Actif</span>
        </div>
      </div>
    </div>
    <button class="copilot__menu-btn" onclick="document.getElementById('copilot-messages').innerHTML = ''; addWelcomeMessage();" title="Clear chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
      </svg>
    </button>
    <button class="copilot__close" id="copilot-close" aria-label="Fermer" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  {# Messages #}
  <div class="copilot__messages" id="copilot-messages">
    <div class="msg-ai">
      <span class="msg-ai__label">Vigile IA</span>
      <div class="msg-ai__bubble">
        Hey ! Je suis votre copilot de flotte. Posez-moi des questions sur vos serveurs, ou demandez-moi de proposer des actions.
      </div>
    </div>
  </div>

  {# Input area #}
  <div class="copilot__input-area">
    <div class="copilot__suggestions" id="copilot-suggestions">
      <button class="copilot__suggestion" onclick="suggestQuery('Quels sont les services qui tournent ?')">Quels services actifs ?</button>
      <button class="copilot__suggestion" onclick="suggestQuery('Y a-t-il des alertes ?')">Alertes ?</button>
    </div>
    <form id="copilot-form" onsubmit="return sendCopilotMessage(event)">
      <div class="copilot__input-wrap">
        <textarea id="copilot-input" class="copilot__input" rows="1"
          placeholder="Interroger la flotte…"></textarea>
        <button type="submit" class="copilot__send" title="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </form>
  </div>
</aside>

<!-- ══ FAB (mobile) ══ -->
<button id="copilot-fab" class="copilot-fab" aria-label="Ouvrir le copilot" type="button">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
</button>

<style>
/* ══ RESPONSIVE COPILOT ══ */

/* Tablet compact (768-1100px) */
@media (max-width: 1100px) {
  .copilot { width: 240px; }
  .copilot__header { padding: 0.65rem 0.85rem; }
  .copilot__header-title { font-size: 0.78rem; }
  .copilot__messages { padding: 0.75rem 0.85rem; gap: 0.7rem; }
  .copilot__input-area { padding: 0.55rem 0.85rem 0.7rem; }
  .copilot__suggestions { gap: 0.25rem; margin-bottom: 0.4rem; }
  .copilot__suggestion { font-size: 0.58rem; padding: 0.15rem 0.45rem; }
  .copilot__input-wrap { padding: 0.25rem 0.45rem; }
  .msg-ai__bubble { padding: 0.6rem 0.75rem; font-size: 0.74rem; }
  .msg-user__bubble { padding: 0.6rem 0.75rem; font-size: 0.74rem; }
}

/* Mobile overlay (<768px) */
@media (max-width: 768px) {
  .copilot-fab {
    display: flex;
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 16px var(--accent-glow);
    transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .copilot-fab:hover { transform: scale(1.06); box-shadow: 0 6px 24px rgba(20, 184, 166, 0.4); }
  .copilot-fab:active { transform: scale(0.94); }
  .copilot-fab svg { width: 20px; height: 20px; }

  .copilot {
    display: none !important;
  }
  .copilot.mobile-open {
    display: flex !important;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 200; width: 100%; height: 100%;
    border-left: none;
    animation: fadeIn 0.2s ease both;
  }

  .copilot__close { display: flex; }

  .copilot.mobile-open ~ .copilot-fab {
    display: none !important;
  }
}

@media (min-width: 769px) {
  .copilot__close { display: none; }
}
</style>

<script>
function suggestQuery(text) {
  var input = document.getElementById('copilot-input');
  if (input) {
    input.value = text;
    input.focus();
  }
}

function addWelcomeMessage() {
  var msgs = document.getElementById('copilot-messages');
  if (msgs) {
    var div = document.createElement('div');
    div.className = 'msg-ai';
    div.innerHTML = '<span class="msg-ai__label">Vigile IA</span><div class="msg-ai__bubble">Hey ! Je suis votre copilot de flotte. Posez-moi des questions sur vos serveurs, ou demandez-moi de proposer des actions.</div>';
    msgs.appendChild(div);
  }
}

/* ══ Toggle mobile overlay ══ */
(function() {
  var fab = document.getElementById('copilot-fab');
  var copilot = document.querySelector('.copilot');
  var closeBtn = document.getElementById('copilot-close');
  if (!fab || !copilot) return;

  function openCopilot() {
    copilot.classList.add('mobile-open');
  }

  function closeCopilot() {
    copilot.classList.remove('mobile-open');
  }

  fab.addEventListener('click', openCopilot);

  if (closeBtn) {
    closeBtn.addEventListener('click', closeCopilot);
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && copilot.classList.contains('mobile-open')) {
      closeCopilot();
    }
  });
})();
</script>

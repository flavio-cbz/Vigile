# Vigile — Docker Compose Test Environment
#
# HTTPS termination via Caddy — Master listens HTTP only on internal network.
# Caddy terminates TLS with self-signed certs (dev) or Let's Encrypt (prod).
#
# Quick start:
#   docker compose build
#   docker compose up -d caddy master
#   ./scripts/setup_test.sh --workers 2
#
# Cleanup:
#   docker compose down -v

services:

  # ── Reverse Proxy (HTTPS termination) ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"    # HTTP→HTTPS redirect
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      master:
        condition: service_healthy
    networks:
      - default

  # ── Master Node ──────────────────────────────────────────────────────
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    restart: unless-stopped
    # Master listens HTTP only on internal network (port 8000).
    # External HTTPS access is handled by Caddy reverse proxy.
    expose:
      - "8000"
    volumes:
      - vigile_data:/app/data
    environment:
      - MASTER_URL=http://localhost:8000
      - DATABASE_PATH=/app/data/vigile.db
      - MASTER_KEY_PATH=/app/data/master_ed25519.key
      - PYTHONPATH=/app
      - DEBUG=true
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      # Secrets auto-generated on first start (dev mode)
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Worker (base service, supports multiple instances) ───────────────
  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Connect via Caddy (HTTPS) — Caddy terminates TLS.
      # ALLOW_INSECURE=true for dev self-signed certs.
      # In prod with real certs, remove ALLOW_INSECURE.
      - MASTER_URL=https://caddy:443
      - ALLOW_INSECURE=true
    healthcheck:
      test: ["CMD-SHELL", "pgrep vigile-worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Use: docker compose run --rm -e JOIN_TOKEN=xxx worker

volumes:
  vigile_data:
  caddy_data:
  caddy_config:

# Vigile — Docker Compose Test Environment
#
# HTTPS termination via Caddy — Master listens HTTP only on internal network.
# Caddy terminates TLS with self-signed certs (dev) or Let's Encrypt (prod).
#
# Quick start:
#   docker compose build
#   docker compose up -d caddy master
#   ./scripts/setup_test.sh --workers 2
#
# Cleanup:
#   docker compose down -v

services:



  # ── Master Node ──────────────────────────────────────────────────────
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    restart: unless-stopped
    ports:
      - "8003:8000"
    volumes:
      - vigile_data:/app/data
      - ./data/worker-dist:/var/cache/vigile/worker
    environment:
      - MASTER_URL=https://vigile.youcloud.ovh
      - DATABASE_PATH=/app/data/vigile.db
      - MASTER_KEY_PATH=/app/data/master_ed25519.key
      - PYTHONPATH=/app
      - DEBUG=true
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - WORKER_BINARY_MANIFEST_URL=file:///var/cache/vigile/worker/manifest.json
      - WORKER_BINARY_CACHE_DIR=/var/cache/vigile/worker
      - SERVER_SECRET_KEY=${SERVER_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Secrets auto-generated on first start (dev mode)
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Worker (base service, supports multiple instances) ───────────────
  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Connect directly to Master (HTTP)
      - MASTER_URL=http://master:8000
      - ALLOW_INSECURE=true
    healthcheck:
      test: ["CMD-SHELL", "pgrep vigile-worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Use: docker compose run --rm -e JOIN_TOKEN=xxx worker

volumes:
  vigile_data:

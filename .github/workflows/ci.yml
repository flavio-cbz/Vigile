name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHONPATH: "."
  PYTHONIOENCODING: utf-8

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest -m "not integration" -v --cov=master --cov-report=term --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Build Worker
        run: |
          cd worker
          go build -v -o vigile-worker .

      - name: Vet Worker
        run: |
          cd worker
          go vet ./...

      - name: Test Worker
        run: |
          cd worker
          go test -race -coverprofile=coverage.out ./...

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flake8 black isort mypy
          pip install -r requirements.txt

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Check formatting (black)
        run: black --check --diff --line-length=100 master/ tests/

      - name: Check imports (isort)
        run: isort --check-only --profile black --line-length=100 master/ tests/

      - name: Lint (flake8)
        run: flake8 --max-line-length=100 --exclude=tests/ --ignore=E203,W503 master/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check SPA fallback files
        run: |
          test -f frontend/dist/index.html || exit 1
          test -f master/static/index.html || exit 1
